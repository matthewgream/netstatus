
# netstatus -- poll the network's devices and publish their state to MQTT, for mqtt-watchdog to alert on.
# Installed as /etc/default/netstatus; a per-host netstatus.<hostname>.cfg is used instead when present.

# where to publish: <mqtt-topic>/<host>, retained, every <interval> seconds
mqtt-server=mqtt://localhost
mqtt-topic=network
interval=30

# the SNMP v2c community the devices answer (read-only; everything is read over SNMP, so no passwords)
snmp-community=public

# device-<label>=<host>: the devices to poll, MikroTik RouterOS or SwOS. The label names it in the
# messages and the journal (the same labels as port-status.js and wifi-status.js use).
device-rbpro=mh-rb960pgs
#device-sw16g2s=uh-sw16g2s
#device-sw8p4s=uh-sw8p4s
#device-hapbelite=uh-hapbelite
#device-rb911g=st-rb911g-2hpnd
#device-omnitik=st-rbomnitikpg-5hacd
#device-rb750r2=wh-rb750r2

# battery-<label>=<volts>: a device fed from mains and a DC UPS at once, which runs on the higher of the
# two; an input reading below <volts> means the mains feed is gone and it is on the UPS alone (on_battery).
# The rbpro: 24 V on ether1 PoE-in from a mains supply, 12 V from the UPS.
battery-rbpro=18
